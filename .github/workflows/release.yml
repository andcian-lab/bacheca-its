name: Release

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      versione_da_ripubblicare:
        description: "SHA corto della versione da ripubblicare"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  build:
    name: Costruisci e sigilla l'artefatto
    runs-on: ubuntu-latest
    outputs:
      versione: ${{ steps.versione.outputs.valore }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ripristina la versione richiesta
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.versione_da_ripubblicare != '' }}
        run: git checkout "${{ inputs.versione_da_ripubblicare }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Calcola l'etichetta di versione
        id: versione
        run: |
          VALORE="$(git rev-parse --short=7 HEAD)"
          echo "valore=$VALORE" >> "$GITHUB_OUTPUT"
          echo "VERSIONE=$VALORE" >> "$GITHUB_ENV"
          echo "### Bacheca ITS - build \`$VALORE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Installa le dipendenze
        run: npm ci

      - name: Esegue i test
        run: npm test

      - name: Costruisce il sito
        run: npm run build

      - name: Carica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: sito
          path: dist/
          retention-days: 30

  collaudo:
    name: Collaudo sull'artefatto, non sul codice
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sito
          path: dist

      - name: La pagina esiste, non e' vuota e ha il foglio di stile
        run: |
          test -s dist/index.html || { echo "index.html mancante o vuoto"; exit 1; }
          test -s dist/style.css || { echo "style.css mancante"; exit 1; }
          grep -q "Bacheca avvisi" dist/index.html || { echo "titolo non trovato"; exit 1; }
          echo "artefatto collaudato"

  approvazione:
    name: Approvazione umana prima della produzione
    needs: [build, collaudo]
    runs-on: ubuntu-latest
    environment: produzione

    steps:
      - name: Registra chi ha approvato
        run: |
          echo "Release ${{ needs.build.outputs.versione }} approvata da ${{ github.actor }}"
          echo "### Approvata la release \`${{ needs.build.outputs.versione }}\` da @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"

  pubblica:
    name: Pubblica sul branch gh-pages
    needs: [build, approvazione]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Scarica l'artefatto da pubblicare
        uses: actions/download-artifact@v4
        with:
          name: sito
          path: sito

      - name: Spingi il contenuto sul branch gh-pages
        run: |
          VERSIONE="${{ needs.build.outputs.versione }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp -r sito/. .
          rm -rf sito
          touch .nojekyll
          git add -A
          git commit -m "pubblica versione $VERSIONE"
          git push --force origin HEAD:gh-pages
          echo "### In produzione la versione \`$VERSIONE\`" >> "$GITHUB_STEP_SUMMARY"