# ---------------------------------------------------------------------------
#  CI - i controlli che girano su OGNI pull request.
#
#  Questo file e' INCOMPLETO: dove trovi  # TODO n  devi scrivere tu.
#  Il primo gate (struttura) e' gia' completo: usalo come esempio.
#
#  Consiglio: completa un TODO alla volta, fai commit, guarda la tab Actions.
#  Un job rosso ti dice esattamente quale riga non va.
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -------------------------------------------------- GATE 1: struttura (ESEMPIO GIA' FATTO)
  struttura:
    name: Gate struttura - i file ci sono ancora?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: I file indispensabili non sono stati cancellati
        run: |
          for f in data/avvisi.json src/build.mjs test/bacheca.test.mjs package.json; do
            if [ ! -f "$f" ]; then
              echo "manca $f: non si passa"
              exit 1
            fi
          done
          echo "struttura del progetto integra"

  # -------------------------------------------------- GATE 2: segreti
  segreti:
    name: Gate segreti - niente credenziali nel repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cerca segreti nel repository
        run: bash script/sniffa-segreti.sh .      

  # -------------------------------------------------- GATE 3: applicazione
  applicazione:
    name: Gate applicazione - dipendenze, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa le dipendenze dal lockfile
        run: npm ci

      - name: Esegue i test
        run: npm test

      - name: Costruisce il sito
        run: npm run build

      - name: Smoke test sull'artefatto
        run: |
          test -s dist/index.html || { echo "dist/index.html mancante o vuoto"; exit 1; }

          attesi=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/avvisi.json','utf8')).avvisi.length)")
          trovati=$(grep -c '<td class="cod">' dist/index.html || true)

          echo "Avvisi attesi: $attesi"
          echo "Righe trovate: $trovati"

          if [ "$attesi" -ne "$trovati" ]; then
            echo "ERRORE: attesi $attesi avvisi, trovati $trovati"
            exit 1
          fi

          echo "Smoke test superato"
          
      # TODO 5 - Carica dist/ come artefatto con nome "sito", cosi' che il
      #          workflow di release possa scaricarlo invece di ricostruirlo.
